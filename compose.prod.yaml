# Production Fields deployment. Use only with a production environment file.
name: ${FIELDS_PROD_PROJECT_NAME:-fields-prod}

services:
  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    restart: unless-stopped
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FIELDS_PUBLIC_ORIGIN:?Set FIELDS_PUBLIC_ORIGIN in .env}
      RUSTFS_ACCESS_KEY: ${FIELDS_RUSTFS_ROOT_ACCESS_KEY:?Set FIELDS_RUSTFS_ROOT_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${FIELDS_RUSTFS_ROOT_SECRET_KEY:?Set FIELDS_RUSTFS_ROOT_SECRET_KEY in .env}
    command:
      - --access-key
      - ${FIELDS_RUSTFS_ROOT_ACCESS_KEY}
      - --secret-key
      - ${FIELDS_RUSTFS_ROOT_SECRET_KEY}
      - /data
    volumes:
      - rustfs-data:/data
    ports:
      - "${FIELDS_RUSTFS_BIND_IP:-172.17.0.1}:${FIELDS_RUSTFS_API_PORT:-61900}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - control
      - runtime

  rustfs-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      FIELDS_RUSTFS_ROOT_ACCESS_KEY: ${FIELDS_RUSTFS_ROOT_ACCESS_KEY}
      FIELDS_RUSTFS_ROOT_SECRET_KEY: ${FIELDS_RUSTFS_ROOT_SECRET_KEY}
      FIELDS_COMPANY_FILES_ACCESS_KEY_ID: ${FIELDS_COMPANY_FILES_ACCESS_KEY_ID:?Set FIELDS_COMPANY_FILES_ACCESS_KEY_ID in .env}
      FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY: ${FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY:?Set FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY in .env}
      FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID: ${FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID:?Set FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID in .env}
      FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY: ${FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY:?Set FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY in .env}
    volumes:
      - type: bind
        source: ./infra/rustfs/init.sh
        target: /init.sh
        read_only: true
      - type: bind
        source: ./infra/rustfs
        target: /policies
        read_only: true
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - control
      - runtime

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fields
      POSTGRES_USER: fields
      POSTGRES_PASSWORD: ${FIELDS_POSTGRES_PASSWORD:?Set FIELDS_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fields -d fields"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control

  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.151.0@sha256:d57bfe8eee2378f31cb1193239fbcac521d54a5a071fca2bfc106916a32b892d
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/gateway.yaml"]
    environment:
      FIELDS_OBSERVABILITY_EXPORT_ENDPOINT: ${FIELDS_OBSERVABILITY_EXPORT_ENDPOINT:?Set the authenticated OTLP HTTPS endpoint in .env}
    secrets:
      - source: fields-observability-export-token
        target: fields-observability-export-token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - type: bind
        source: ./observability/gateway.production.yaml
        target: /etc/otelcol-contrib/gateway.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      control:
        aliases: [lgtm]
      runtime:
        aliases: [lgtm]

  backend:
    image: ${FIELDS_BACKEND_IMAGE:-registry.example.com/fields/backend:${FIELDS_IMAGE_TAG:-latest}}
    pull_policy: ${FIELDS_IMAGE_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "node node_modules/drizzle-kit/bin.cjs migrate && exec node dist/composition/backend-runtime/main.js"]
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fields:${FIELDS_POSTGRES_PASSWORD}@postgres:5432/fields
      FIELDS_BACKEND_HOST: 0.0.0.0
      FIELDS_BACKEND_PORT: 4102
      FIELDS_CLIENT_ORIGINS: ${FIELDS_PUBLIC_ORIGIN:?Set FIELDS_PUBLIC_ORIGIN in .env}
      FIELDS_AUTH_TRUSTED_ORIGINS: ${FIELDS_PUBLIC_ORIGIN}
      BETTER_AUTH_URL: ${FIELDS_PUBLIC_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      FIELDS_FILE_SHARE_SECRET: ${FIELDS_FILE_SHARE_SECRET:?Set FIELDS_FILE_SHARE_SECRET in .env}
      FIELDS_INTERNAL_CONTROL_TOKEN_FILE: /run/secrets/fields-control-token
      FIELDS_INTERNAL_COMPANY_ID: ${FIELDS_INTERNAL_COMPANY_ID:?Set FIELDS_INTERNAL_COMPANY_ID in .env}
      FIELDS_COMPANY_ID: ${FIELDS_INTERNAL_COMPANY_ID:?Set FIELDS_INTERNAL_COMPANY_ID in .env}
      FIELDS_COMPANY_RUNTIME_URL: http://127.0.0.1:4110
      FIELDS_COMPANY_RUNTIME_CALLBACK_BASE_URL: http://127.0.0.1:4102/api/v1
      FIELDS_COMPANY_RUNTIME_WORKDIR: /workdir
      FIELDS_COMPANY_RUNTIME_HOST: 0.0.0.0
      FIELDS_COMPANY_RUNTIME_PORT: 4110
      FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY: ${FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY:?Set FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY in .env}
      FIELDS_COMPANY_RUNTIME_VOLUME_NAME: ${FIELDS_COMPANY_RUNTIME_VOLUME_NAME:?Set FIELDS_COMPANY_RUNTIME_VOLUME_NAME in .env}
      FIELDS_OBJECT_STORAGE_INTERNAL_ENDPOINT: http://rustfs:9000
      FIELDS_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${FIELDS_OBJECT_STORAGE_PUBLIC_ENDPOINT:?Set browser-accessible RustFS endpoint in .env}
      FIELDS_OBJECT_STORAGE_REGION: ${FIELDS_OBJECT_STORAGE_REGION:-us-east-1}
      FIELDS_COMPANY_FILES_BUCKET: fields-company-files
      FIELDS_COMPANY_FILES_ACCESS_KEY_ID: ${FIELDS_COMPANY_FILES_ACCESS_KEY_ID:?Set FIELDS_COMPANY_FILES_ACCESS_KEY_ID in .env}
      FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY: ${FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY:?Set FIELDS_COMPANY_FILES_SECRET_ACCESS_KEY in .env}
      FIELDS_COMPANY_ASSETS_BUCKET: fields-company-assets
      FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID: ${FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID:?Set FIELDS_COMPANY_ASSETS_ACCESS_KEY_ID in .env}
      FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY: ${FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY:?Set FIELDS_COMPANY_ASSETS_SECRET_ACCESS_KEY in .env}
      FIELDS_EMBODIMENT_RUNTIME_URL: http://embodiment:4105
      OTEL_SERVICE_NAME: fields-backend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=fields,deployment.environment.name=production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([4102,4110].map(port=>fetch('http://127.0.0.1:'+port+'/health').then(r=>{if(!r.ok)throw new Error(String(port))}))).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - control
      - runtime
    volumes:
      - company-runtime-data:/workdir
      - type: bind
        source: ${FIELDS_INTERNAL_CONTROL_TOKEN_FILE}
        target: /run/secrets/fields-control-token
        read_only: true
        bind:
          create_host_path: false

  embodiment:
    image: ${FIELDS_BACKEND_IMAGE:-registry.example.com/fields/backend:${FIELDS_IMAGE_TAG:-latest}}
    pull_policy: ${FIELDS_IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    command: ["node", "--import", "./dist/observability/bootstrap.js", "dist/composition/embodiment/main.js"]
    environment:
      NODE_ENV: production
      FIELDS_EMBODIMENT_HOST: 0.0.0.0
      FIELDS_EMBODIMENT_PORT: 4105
      FIELDS_BACKEND_EMBODIMENT_API_URL: http://backend:4102
      FIELDS_INTERNAL_CONTROL_TOKEN_FILE: /run/secrets/fields-control-token
      FIELDS_EMBODIMENT_SPEECH_PROVIDER: qwen
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-qwen3-tts-flash}
      QWEN_STT_MODEL: ${QWEN_STT_MODEL:-qwen3-asr-flash}
      QWEN_TTS_VOICE: ${QWEN_TTS_VOICE:-Cherry}
      QWEN_TTS_LANGUAGE: ${QWEN_TTS_LANGUAGE:-Auto}
      OTEL_SERVICE_NAME: fields-embodiment
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=fields,deployment.environment.name=production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4105/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - control
    volumes:
      - type: bind
        source: ${FIELDS_INTERNAL_CONTROL_TOKEN_FILE}
        target: /run/secrets/fields-control-token
        read_only: true
        bind:
          create_host_path: false
  event:
    image: ${FIELDS_BACKEND_IMAGE:-registry.example.com/fields/backend:${FIELDS_IMAGE_TAG:-latest}}
    pull_policy: ${FIELDS_IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    command: ["node", "--import", "./dist/observability/bootstrap.js", "dist/composition/event/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fields:${FIELDS_POSTGRES_PASSWORD}@postgres:5432/fields
      FIELDS_EVENT_HOST: 0.0.0.0
      FIELDS_EVENT_PORT: 4104
      FIELDS_INTERNAL_COMPANY_ID: ${FIELDS_INTERNAL_COMPANY_ID:?Set FIELDS_INTERNAL_COMPANY_ID in .env}
      FIELDS_COMPANY_RUNTIME_URL: http://backend:4110
      FIELDS_INTERNAL_CONTROL_TOKEN_FILE: /run/secrets/fields-control-token
      FIELDS_WEB_PUSH_SUBJECT: ${FIELDS_WEB_PUSH_SUBJECT:?Set FIELDS_WEB_PUSH_SUBJECT in .env}
      FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY: ${FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY:?Set FIELDS_WEB_PUSH_VAPID_PUBLIC_KEY in .env}
      FIELDS_WEB_PUSH_VAPID_PRIVATE_KEY: ${FIELDS_WEB_PUSH_VAPID_PRIVATE_KEY:?Set FIELDS_WEB_PUSH_VAPID_PRIVATE_KEY in .env}
      OTEL_SERVICE_NAME: fields-event
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=fields,deployment.environment.name=production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4104/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - control
      - runtime
    volumes:
      - type: bind
        source: ${FIELDS_INTERNAL_CONTROL_TOKEN_FILE}
        target: /run/secrets/fields-control-token
        read_only: true
        bind:
          create_host_path: false

  gateway:
    image: ${FIELDS_GATEWAY_IMAGE:-registry.example.com/fields/gateway:${FIELDS_IMAGE_TAG:-latest}}
    pull_policy: ${FIELDS_IMAGE_PULL_POLICY:-always}
    build:
      context: gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FIELDS_SITE_ADDRESS: ${FIELDS_SITE_ADDRESS:-:80}
      FIELDS_DESKTOP_BLOB_ORIGIN: ${FIELDS_DESKTOP_BLOB_ORIGIN:?Set FIELDS_DESKTOP_BLOB_ORIGIN in .env}
      FIELDS_PWA_STORAGE_ORIGINS: ${FIELDS_OBJECT_STORAGE_PUBLIC_ENDPOINT:?Set FIELDS_OBJECT_STORAGE_PUBLIC_ENDPOINT in .env}
    depends_on:
      backend:
        condition: service_healthy
      embodiment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      # The shared host Caddy owns public :80/:443 and TLS. It proxies the
      # Fields virtual host to this private gateway binding.
      - "${FIELDS_GATEWAY_BIND_IP:-172.17.0.1}:${FIELDS_GATEWAY_PORT:-61080}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - control

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
  caddy-config:
  company-runtime-data:
    name: ${FIELDS_COMPANY_RUNTIME_VOLUME_NAME:?Set FIELDS_COMPANY_RUNTIME_VOLUME_NAME in .env}

secrets:
  fields-observability-export-token:
    environment: FIELDS_OBSERVABILITY_EXPORT_TOKEN

networks:
  control:
    name: ${FIELDS_CONTROL_NETWORK:-fields-control}
  runtime:
    name: ${FIELDS_RUNTIME_NETWORK:-fields-runtime}
