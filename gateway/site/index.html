<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/fields-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Download Fields for Windows</title>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="download" aria-labelledby="download-title">
        <div class="brand" aria-label="Fields">
          <img src="/fields-mark.svg" alt="" width="48" height="48" />
          <span>Fields</span>
        </div>

        <div class="copy">
          <h1 id="download-title" data-en="Fields for Windows" data-zh="Fields Windows 版">
            Fields for Windows
          </h1>
        </div>

        <div class="action">
          <a class="download-button" href="/desktop/download/FieldsSetup.exe">
            <span data-en="Download for Windows" data-zh="下载 Windows 版">Download for Windows</span>
            <span class="arrow" aria-hidden="true">&#8595;</span>
          </a>
          <p class="release" aria-live="polite">
            <span id="release-detail" data-en="Windows x64" data-zh="Windows x64">
              Windows x64
            </span>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
